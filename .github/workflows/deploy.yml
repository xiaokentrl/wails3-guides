name: build & deploy

# 每次 push 到 main：跑全部质量门 → 双产物打包（便携目录版 + 纯静态单文件 HTML）→ 发布到 GitHub Pages。
# Pages 地址：https://xiaokentrl.github.io/wails3-guides/
#   /                    = 便携目录版（组件导航 viewer）
#   /standalone.html     = 单文件版（全内联，可另存离线用）

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .preview/package-lock.json

      - name: 安装依赖
        run: npm ci
        working-directory: .preview

      - name: 建立依赖符号链接（ui/ 源文件解析 react 等依赖用）
        run: ln -s .preview/node_modules node_modules

      - name: 类型检查（strict）
        run: npm run typecheck
        working-directory: .preview

      - name: 测试（85 用例）
        run: npm test
        working-directory: .preview

      - name: 五项自查
        run: node scripts/check.mjs
        working-directory: ui

      - name: 打包（便携目录版 + 单文件版）
        run: npm run build
        working-directory: .preview

      - name: 单文件版标准化命名
        run: mv "dist/组件导航-单文件版.html" dist/standalone.html
        working-directory: .preview

      - uses: actions/configure-pages@v5
        # 首次运行若报 Pages 未启用：仓库 Settings → Pages → Source 选「GitHub Actions」（一次性设置）

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .preview/dist

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-html
          path: .preview/dist/standalone.html
          retention-days: 14

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 打 v* 标签推送 → 自动创建 GitHub Release（双语说明从 RELEASES.md 提取，附单文件 HTML）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release 与上传附件
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .preview/package-lock.json

      - name: 建立依赖符号链接（ui/ 解析依赖用）
        run: ln -s .preview/node_modules node_modules

      - run: npm ci
        working-directory: .preview

      - run: npm run build:single
        working-directory: .preview

      - name: 从 RELEASES.md 提取本版本双语说明（英文段 + 中文段，截止到第二个分隔线）
        run: awk '/^### '"${GITHUB_REF_NAME}"'/{f=1} f&&/^---$/{c++; if (c==2) exit} f' RELEASES.md > body.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: body.md
          generate_release_notes: true
          files: .preview/dist-single/index.html
