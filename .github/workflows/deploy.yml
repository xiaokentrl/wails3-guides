name: build & deploy

# 每次 push 到 main：跑全部质量门 → 双产物打包（便携目录版 + 纯静态单文件 HTML）→ 发布到 GitHub Pages。
# Pages 地址：https://xiaokentrl.github.io/wails3-guides/
#   /                    = 便携目录版（组件导航 viewer）
#   /standalone.html     = 单文件版（全内联，可另存离线用）

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  # 按 ref 类型隔离：标签（发版）运行不得取消 main 的 Pages 部署，反之亦然。
  # 同一 main 连续推送仍互相取消（只有最新一次需要部署）。group 不能写死 'pages'：
  # 2026-11-10 v1.6.0 发版时，标签运行抢占了 main 推送的 deploy，部署卡在
  # deployment_queued 后被整体取消（run #33）。
  group: pages-${{ github.ref_type }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .preview/package-lock.json

      - name: 安装依赖
        run: npm ci
        working-directory: .preview

      - name: 建立依赖符号链接（ui/ 源文件解析 react 等依赖用）
        run: ln -s .preview/node_modules node_modules

      - name: 类型检查（strict）
        run: npm run typecheck
        working-directory: .preview

      - name: 测试（85 用例）
        run: npm test
        working-directory: .preview

      - name: 五项自查
        run: node scripts/check.mjs
        working-directory: ui

      - name: 打包（便携目录版 + 单文件版）
        run: npm run build
        working-directory: .preview

      - name: 同步 Release 正文（双语提取 → gh release edit）
        if: github.ref_type == 'branch'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./ui/package.json').version")
          # 定版提交先于标签推送进入 main，此时本版本的 Release 还没由标签流水线创建。
          # 2026-11-10 v1.6.0 起改为：Release 不存在就跳过（标签流水线创建 Release 时的
          # body_path 已带本版正文），不得让本步骤报红连累 Pages 部署。
          if ! gh release view "v$VERSION" --json tagName --jq .tagName >/dev/null 2>&1; then
            echo "Release v$VERSION 尚未创建（等待标签流水线），跳过正文同步"
            exit 0
          fi
          EN_FROM='^### v'"$VERSION"' What'
          CN_FROM='^### v'"$VERSION"' 相比'
          { awk -v from="$EN_FROM" 'BEGIN{f=0} $0 ~ from {f=1} f && /^### v[0-9]/ && $0 !~ from {exit} f' RELEASES.md
            printf '\n---\n'
            awk -v from="$CN_FROM" 'BEGIN{f=0} $0 ~ from {f=1} f && /^### v[0-9]/ && $0 !~ from {exit} f' RELEASES.md
          } > body.md
          gh release edit "v$VERSION" --notes-file body.md

      - uses: actions/configure-pages@v5
        # 首次运行若报 Pages 未启用：仓库 Settings → Pages → Source 选「GitHub Actions」（一次性设置）

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .preview/dist

      - uses: actions/upload-artifact@v4
        with:
          name: standalone-html
          path: .preview/dist/standalone.html
          retention-days: 14

  deploy:
    needs: build
    if: github.ref_type == 'branch' # Pages 由 main 推送部署；tag 推送只需产出 Release
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 打 v* 标签推送 → 自动创建 GitHub Release（双语说明从 RELEASES.md 提取，附单文件 HTML）
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write # 创建 Release 与上传附件
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: .preview/package-lock.json

      - name: 建立依赖符号链接（ui/ 解析依赖用）
        run: ln -s .preview/node_modules node_modules

      - run: npm ci
        working-directory: .preview

      - run: npm run build:single
        working-directory: .preview

      - name: 从 RELEASES.md 提取本版本双语说明（英文段 + 中文段，按下一个版本头精确截断）
        run: |
          EN_FROM='^### '"${GITHUB_REF_NAME}"' What'
          CN_FROM='^### '"${GITHUB_REF_NAME}"' 相比'
          awk -v from="$EN_FROM" 'BEGIN{f=0} $0 ~ from {f=1} f && /^### v[0-9]/ && $0 !~ from {exit} f' RELEASES.md > body.md
          printf '\n---\n' >> body.md
          awk -v from="$CN_FROM" 'BEGIN{f=0} $0 ~ from {f=1} f && /^### v[0-9]/ && $0 !~ from {exit} f' RELEASES.md >> body.md

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: body.md
          files: .preview/dist-single/index.html
